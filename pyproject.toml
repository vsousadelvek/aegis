[project]
name = "aegis"
version = "1.0.0"
description = "AEGIS — Sistema de Deteccao de Ameacas Urbanas. Vigilancia multi-camera em tempo real com deteccao de anomalias comportamentais."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Delvek da Silva Venceslau de Sousa" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "ultralytics>=8.3,<9",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "torch>=2.4,<3",
    "lap>=0.5,<1",
    "shapely>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
